# ================== 生产环境专用配置（spring.profiles.active=prod 时启用）==================
# 说明：
#  1. 数据源：必须通过环境变量注入 PostgreSQL，禁止使用 H2 内存库（丢数据/演示污染）。
#  2. ddl-auto 用 validate：Schema 由 DDL 基线/迁移脚本管理，禁止 create-drop 每次重建。
#  3. 数据播种默认关闭，且由 ProductionGuard 强制校验 APP_SEED_ENABLED=false，避免污染真实库。
#  4. H2 console 生产关闭，避免暴露数据库管理界面。
#  5. 密钥：JWT token-secret 与 AES crypto-key 均须显式注入，ProductionGuard 会拒绝使用默认值启动。
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

app:
  security:
    token-secret: ${APP_SECURITY_TOKEN_SECRET}
    token-ttl-minutes: ${APP_SECURITY_TOKEN_TTL_MINUTES:480}
    # 允许的跨源白名单（逗号分隔）；生产按实际前端域名配置，切勿留默认 localhost
    allowed-origins: ${APP_ALLOWED_ORIGINS:}
  seed:
    # 生产默认关闭；ProductionGuard 同时校验该值必须为 false
    enabled: ${APP_SEED_ENABLED:false}

logging:
  level:
    root: info
    com.exam: info
