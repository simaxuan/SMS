server:
  port: 8080

spring:
  application:
    name: exam-score-backend
  datasource:
    # 默认用文件型 H2 持久化（非内存），重启不丢数据，适配单机启动器免装库部署。
    # 生产环境应通过 profile（prod/pg）切换 PostgreSQL。
    # P2-4 暴露面收敛：AUTO_SERVER 允许外部进程经 TCP 连库，默认关闭；仅本地需多进程连库时才经
    # APP_H2_AUTO_SERVER=true 显式开启（后端单进程连接文件库无需此开关）。
    url: jdbc:h2:file:./data/examdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=${APP_H2_AUTO_SERVER:false}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 文件库用 update：表自动创建/演进，重启不清空数据（内存 demo 用 create-drop 会丢数据）
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      # 安全：默认关闭 Web 控制台（本应用是自定义拦截器，/h2-console 无鉴权，暴露有 SQL 执行风险）。
      # 仅开发本地调试时通过 APP_H2_CONSOLE_ENABLED=true 显式开启；数据库直连仍可用客户端/启动器。
      enabled: ${APP_H2_CONSOLE_ENABLED:false}
      path: /h2-console

app:
  security:
    # JWT 签名密钥（HS256）。上线必须通过环境变量 APP_SECURITY_TOKEN_SECRET / 配置中心显式注入。
    # P2-1：默认留空——未注入时由 AppKeyProvider 自动生成并持久化到本地密钥文件的强随机密钥兜底，
    # 消除固定默认演示密钥；生产由 ProductionGuard 强制 fail-fast 要求显式注入。
    token-secret: ${APP_SECURITY_TOKEN_SECRET:}
    # 令牌有效期（分钟）；默认 8 小时
    token-ttl-minutes: 480
    # 允许的跨源（CORS + CSRF Origin 校验白名单），逗号分隔；生产需按实际部署域名配置，
    # 同源请求无论是否在此列表均放行（Origin=自身 host）。
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    # 数据播种开关：开发/H2 演示默认开启；生产关闭避免污染真实库（I-7）
    enabled: ${APP_SEED_ENABLED:true}

logging:
  level:
    root: info
    com.exam: debug
