# PostgreSQL 生产环境配置（使用：--spring.profiles.active=pg）
server:
  port: 8080

spring:
  application:
    name: exam-score-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/examdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: info
    com.exam: debug
