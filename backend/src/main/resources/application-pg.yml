# PostgreSQL 生产环境配置（使用：--spring.profiles.active=pg）
server:
  port: 8080

spring:
  application:
    name: exam-score-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:examdb}
    driver-class-name: org.postgresql.Driver
    # P2-3 弱口令收敛：库口令必须显式注入（无默认值），上线前必须设置强口令
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # 生产禁用 H2 控制台（base 配置默认亦为关闭，仅演示用，避免暴露数据库管理界面）
  h2:
    console:
      enabled: false

app:
  security:
    # P2-3 弱口令收敛：生产密钥必须显式注入（无默认值），禁止用演示密钥上线
    token-secret: ${APP_SECURITY_TOKEN_SECRET}
  seed:
    # pg 为生产数据库：默认关闭播种避免演示数据污染真实库（ProductionGuard 强制校验 false）
    enabled: ${APP_SEED_ENABLED:false}

logging:
  level:
    root: info
    com.exam: debug
